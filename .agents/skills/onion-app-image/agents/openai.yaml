interface:
  display_name: "APP 图片生成"
  short_description: "把确认的 APP 图片文案经配置卡直接生成投放图片"
  default_prompt: "使用 $onion-app-image 先打开图片配置卡，再根据已确认图片文案直接生成 APP 图片候选，并按我的选择交付。暂不做已有图片迭代。"
dependencies:
  tools:
    - type: "mcp"
      value: "onion-agent"
      description: "通过统一OAuth调用KIE生图并取回短时候选"
      transport: "streamable_http"
      url: "https://intel-mcp.guanghexinzhi.cn/agent/mcp"
policy:
  allow_implicit_invocation: true
